databases:
  - name: hospital-db
    databaseName: hospital_citas
    plan: free

services:
  - type: web
    name: hospital-citas-postgres
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_ENGINE
        value: postgres
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-db
          property: connectionString

  - type: web
    name: hospital-citas-firestore
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_ENGINE
        value: firestore
      - key: AUTO_SEED
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
